# Local Postgres for development and tests.
# Port 5433 so it doesn't collide with a Postgres already installed on 5432.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: votercontact
      POSTGRES_PASSWORD: votercontact
      POSTGRES_DB: votercontact
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start: creates the votercontact_test database.
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
